# @package _global_
# Stage-1 PGT (pre-training) with the SG-3 color head, full-parameter.
#
# Recipe = EcoSplat's own 10-view training config (config/experiment/spfsplat/
# re10k_10view.yaml) with IGF removed and the color head swapped:
#   * 10 context views, 1 target view, no view-sampling curriculum
#   * batch 1 per rank x accumulate 4 => effective batch 4
#   * 400_001 steps, lr 1e-4, 2K linear warm-up, cosine to 1e-6
#   * backbone at 0.1x lr, mse + lpips + reproj(0.001, dyntanh)
#   * initialised from pretrained_weights/re10k_10view.ckpt, the same base
#     checkpoint EcoSplat finetunes; only the first 11 head channels (opacity,
#     scale, rotation, c0) are aligned, the three SG lobes start from scratch.
# Deviations from the official file, all deliberate:
#   1. head SG-3 (32 channels) instead of SH4 (83) — the representation studied
#   2. train.unfreeze_all: the encoder freezes every parameter at construction
#      (upstream's second-stage convention), so a full-parameter run has to
#      release them explicitly; split_backbone_lr makes the 0.1x multiplier real
#      (upstream packs every trainable parameter into one group, `if True:`)
#   3. reproj.total_iterations follows max_steps (the official file says
#      200_001 next to max_steps 400_001, an upstream inconsistency)
#   4. checkpointing.save_top_k: 3 keeps the three newest (monitor is
#      info/global_step, mode max), i.e. 22 GB instead of the full 290 GB
#      ladder; train_pgt_bg.sh sync pushes every checkpoint to object storage
#      so the history survives off-box, and resume only needs the newest
#
# Launch (4 GPUs, effective batch 4 = 4 x 1, no accumulation):
#   ./train_pgt_bg.sh start 3,2,4,6
# Single GPU (exactly Eco's 1 x accumulate 4):
#   ./train_pgt_bg.sh start 3

defaults:
  - /dataset@_group_.re10k: re10k
  - override /model/encoder: spfsplat
  - override /model/encoder/backbone: croco_multi
  - override /model/decoder: splatting_cuda
  - override /loss: [mse, lpips, reproj]

wandb:
  name: re10k-pgt-sg3-10v
  tags: [re10k, 256x256, sg, pgt, 10view]
  project: spfsplat

loss:
  reproj:
    weight: 0.001
    mode: "dyntanh"
    total_iterations: 400_001

model:
  encoder:
    backbone:
      name: croco_multi
      intrinsics_embed_loc: encoder
      intrinsics_embed_type: token

    # Stage-1 Lightning checkpoint: sg_wrapper's partial loader reads the
    # `encoder.*` keys. `igf` must stay absent — its presence switches the
    # encoder into the second stage.
    pretrained_weights: pretrained_weights/re10k_10view.ckpt

    sg:
      num_lobes: 3

dataset:
  re10k:
    make_baseline_1: true
    view_sampler:
      warm_up_steps: 0
      num_target_views: 1
      num_context_views: 10
      max_distance_between_context_views: 150

optimizer:
  lr: 1e-4
  warm_up_steps: 2000
  backbone_lr_multiplier: 0.1
  min_lr_multiplier: 0.01

data_loader:
  train:
    batch_size: 1

trainer:
  max_steps: 400_001
  val_check_interval: 10000
  accumulate_grad_batches: 4

checkpointing:
  every_n_train_steps: 10000
  save_weights_only: false
  save_top_k: 3

train:
  training_context: false
  unfreeze_all: true
  split_backbone_lr: true
  freeze_pretrained: false
  freeze_pose_head: false
  freeze_intrinsic_encoder: false

test:
  output_path: outputs/test/pgt_sg3_10v
  align_pose: false
  compute_scores: true
  save_image: true
  save_video: false
  save_compare: false
