# @package _global_
# Representation-swap reference: stock SH degree-4 head (83 output channels,
# 75 color floats), trained with the same heads-only recipe as the SG/SH1/SH2
# variants. The released stage-1 checkpoint is a different-recipe anchor; this
# run makes the full SH family comparable at equal training budget.

defaults:
  - /dataset@_group_.re10k: re10k
  - override /model/encoder: spfsplat
  - override /model/encoder/backbone: croco_multi
  - override /model/decoder: splatting_cuda
  - override /loss: [mse, lpips, reproj]

wandb:
  name: re10k-sh4
  tags: [re10k, 256x256, sh4]
  project: spfsplat

loss:
  reproj:
    weight: 0.001
    mode: "dyntanh"
    total_iterations: 100_001

model:
  encoder:
    backbone:
      name: croco_multi
      intrinsics_embed_loc: encoder
      intrinsics_embed_type: token

    pretrained_weights: pretrained_weights/re10k_10view.ckpt

dataset:
  re10k:
    make_baseline_1: true
    view_sampler:
      warm_up_steps: 0
      num_target_views: 1
      num_context_views: 10
      max_distance_between_context_views: 150

optimizer:
  lr: 1e-4
  warm_up_steps: 2000
  backbone_lr_multiplier: 0.1
  min_lr_multiplier: 0.01

data_loader:
  train:
    batch_size: 1

trainer:
  max_steps: 100_001
  val_check_interval: 10000
  accumulate_grad_batches: 4

checkpointing:
  every_n_train_steps: 10000
  save_weights_only: false
  save_top_k: 1

train:
  training_context: false
  # Only the Gaussian parameter heads train; intrinsic_encoder is frozen
  # explicitly (same for every variant, so comparisons stay fair).
  freeze_pretrained: true
  freeze_pose_head: true
  freeze_intrinsic_encoder: true

test:
  output_path: outputs/test/sh4
  align_pose: false
  compute_scores: true
  save_image: true
  save_video: false
  save_compare: false
