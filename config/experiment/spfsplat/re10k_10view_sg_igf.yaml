# @package _global_
# Stage-2 IGF on the SG head: the encoder freezes the SG-adapted base and
# trains only the IGF module (deep copies of the SG param heads + rate_embed)
# for the rho_N axis. L-bar stays post-hoc at inference (SG_LOBE_AVG /
# SG_BUDGET_MB), so this run adds the N axis without touching the lobe axis.
#
# The base checkpoint MUST have the same 25-ch head width (opacity + scale
# 3 + rotation 4 + c0 3 + 3 lobes x 7 = 1 + 24) — pass
#   model.encoder.pretrained_weights=<path/to/sg3_stepNNNNN.ckpt>
# at launch; the IGF branch strict-loads it inside the encoder.

defaults:
  - /dataset@_group_.re10k: re10k
  - override /model/encoder: spfsplat
  - override /model/encoder/backbone: croco_multi
  - override /model/decoder: splatting_cuda
  - override /loss: [mse, lpips, reproj]

wandb:
  name: re10k-sg3-igf
  tags: [re10k, 256x256, sg, igf]
  project: spfsplat

loss:
  reproj:
    weight: 0.001
    mode: "dyntanh"
    total_iterations: 100_001

model:
  encoder:
    backbone:
      name: croco_multi
      intrinsics_embed_loc: encoder
      intrinsics_embed_type: token

    pretrained_weights: ""   # override at launch with the SG base ckpt
    sg:
      num_lobes: 3
    igf: {}

dataset:
  re10k:
    make_baseline_1: true
    view_sampler:
      warm_up_steps: 0
      num_target_views: 1
      num_context_views: 10
      max_distance_between_context_views: 150

optimizer:
  lr: 1e-4
  warm_up_steps: 2000
  backbone_lr_multiplier: 0.1
  min_lr_multiplier: 0.01

data_loader:
  train:
    batch_size: 1

trainer:
  max_steps: 100_001
  val_check_interval: 10000
  accumulate_grad_batches: 4

checkpointing:
  every_n_train_steps: 10000
  save_weights_only: false
  save_top_k: 1

train:
  training_context: false
  # The encoder already freezes everything and marks only igf.* trainable
  # when igf is set. Keep the wrapper-level switches OFF: freeze_pretrained
  # would unfreeze the ORIGINAL param heads too (their names contain
  # "gaussian_param_head"), which is not the IGF recipe.
  freeze_pretrained: false
  freeze_pose_head: false
  freeze_intrinsic_encoder: false

test:
  output_path: outputs/test/sg3_igf
  align_pose: false
  compute_scores: true
  save_image: true
  save_video: false
  save_compare: false
